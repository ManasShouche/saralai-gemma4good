[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "saralai-backend"
version = "1.0.0"
description = "SaralAI backend — multimodal welfare scheme matching agent"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.27.1",
    "ollama==0.1.7",
    "python-multipart==0.0.9",
    "reportlab==4.1.0",
    "pypdf2==3.0.1",
    "sqlite-utils==3.35",
    "pillow==10.2.0",
    "faster-whisper==1.0.1",
    "sse-starlette==2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
